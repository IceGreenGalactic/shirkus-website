[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/sitemap.xml"
  to = "/public/sitemap.xml"
  status = 200

# SPA fallback (Vite / React)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5174
  framework = "vite"
